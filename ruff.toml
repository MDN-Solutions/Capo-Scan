# Python tooling in tools/ (Blender, FIPE, DTCs, simulator).
target-version = "py312"
line-length = 100

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "S",        # flake8-bandit (security)
    "PTH",      # use pathlib
    "RUF",
]
