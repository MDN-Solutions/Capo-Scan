[workspace]
resolver = "3"
members = ["ext-data"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/MDN-Solutions/MDN-Scan"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Fallible paths must handle errors instead of panicking (allowed in tests,
# see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Integer overflow panics instead of silently wrapping (also in release).
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = "debuginfo"
