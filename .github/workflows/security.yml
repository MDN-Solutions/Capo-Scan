name: Security

# cargo-deny    RustSec vulnerabilities, licenses, banned crates, allowed sources
# dependency    blocks pull requests that add vulnerable or badly licensed deps
# CodeQL        security-and-quality queries for C++, Rust and the workflows
# gitleaks      secrets (keys, tokens, license-signing keys) in the git history

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: new advisories appear even when the code does not change.
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tool
        with:
          url: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.1/cargo-deny-0.22.1-x86_64-unknown-linux-musl.tar.gz
          sha256: 13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d
          binary: cargo-deny-0.22.1-x86_64-unknown-linux-musl/cargo-deny
      - run: cargo deny --locked check --show-stats

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Any known vulnerability in a new or updated dependency (Cargo,
          # GitHub Actions, the pinned Python CI tools) fails the PR.
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          # Licenses of shipped code are enforced by cargo-deny (deny.toml);
          # the Python packages here are CI-only tools and are not distributed.
          license-check: false
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 4

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Product code only (no tests, no third-party code): see the codeql preset.
      - name: Build C++
        if: matrix.language == 'c-cpp'
        run: |
          cmake --preset codeql
          cmake --build --preset codeql

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-tool
        with:
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          binary: gitleaks
      - name: Scan the whole history
        run: gitleaks git --redact --verbose --no-banner .
