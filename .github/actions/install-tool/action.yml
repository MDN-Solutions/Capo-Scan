name: Install a verified tool
description: >
  Downloads an exact release of a tool, fails unless its SHA-256 matches, and
  installs the binary in /usr/local/bin. Every third-party binary used by the
  workflows goes through here. Linux runners only.

inputs:
  url:
    description: Download URL of an exact version (no "latest" links).
    required: true
  sha256:
    description: Expected SHA-256 of the downloaded file.
    required: true
  binary:
    description: Path of the executable inside the archive, or the file name for a plain binary.
    required: true

runs:
  using: composite
  steps:
    - name: Download, verify and install
      shell: bash
      env:
        URL: ${{ inputs.url }}
        SHA256: ${{ inputs.sha256 }}
        BINARY: ${{ inputs.binary }}
      run: |
        set -euo pipefail
        dir="$(mktemp -d "${RUNNER_TEMP}/tool.XXXXXX")"
        file="${dir}/$(basename "${URL}")"
        curl --fail --silent --show-error --location --retry 3 \
          --proto '=https' --tlsv1.2 --output "${file}" "${URL}"
        echo "${SHA256}  ${file}" | sha256sum --check --strict
        case "${file}" in
          *.tar.gz | *.tgz) tar -xzf "${file}" -C "${dir}" ;;
          *.tar.xz) tar -xJf "${file}" -C "${dir}" ;;
        esac
        # /usr/local/bin is already on PATH: no write to $GITHUB_PATH needed.
        sudo install -m 0755 "${dir}/${BINARY}" "/usr/local/bin/$(basename "${BINARY}")"
