name: Python CI tools
description: >
  Python 3.13 with the CI tools from .github/requirements/ci-tools.txt
  (clang-format, ruff, gdtoolkit, zizmor), installed with hash checking so a
  tampered package cannot be installed, and from wheels only, so no package
  build code runs.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Install tools (hash-checked)
      shell: bash
      run: >
        python -m pip install --disable-pip-version-check --require-hashes --no-deps
        --only-binary :all: -r "${GITHUB_WORKSPACE}/.github/requirements/ci-tools.txt"
